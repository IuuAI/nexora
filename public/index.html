<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora — 导航中枢</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <!-- 页头 -->
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">◈</span>
                <span class="logo-text" id="siteTitle">Nexora</span>
            </div>
            <nav class="nav-links">
                <a href="#" class="nav-item active" data-filter="all">全部</a>
                <a href="#" class="nav-item" data-filter="work">工作</a>
                <a href="#" class="nav-item" data-filter="life">生活</a>
                <a href="#" class="nav-item" data-filter="tech">技术</a>
            </nav>
        </div>
    </header>

    <!-- 主体 -->
    <main class="main">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索书签..." autocomplete="off">
            <span class="search-icon">🔍</span>
        </div>
        <div class="categories-container" id="categoriesContainer"></div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-inner">
            <p id="siteFooter">Nexora &copy; 2026</p>
            <p class="footer-note" id="siteSubtitle">科技驱动的导航中枢</p>
        </div>
    </footer>

    <!-- 右下角功能区 -->
    <div class="fab-container" id="fabContainer">
        <!-- 未登录状态 -->
        <button class="fab-btn" id="fabBtn" title="管理控制台">
            <span class="fab-icon">⚙️</span>
        </button>
        
        <!-- 已登录状态 -->
        <div class="fab-menu" id="fabMenu" style="display:none;">
            <button class="fab-item" id="fabThemeToggle" title="切换主题">
                <span>🌗</span>
                <span>主题</span>
            </button>
            <button class="fab-item" id="backToHomeBtn" title="返回首页">
                <span>🏠</span>
                <span>首页</span>
            </button>
            <button class="fab-item" id="logoutBtn" title="退出登录">
                <span>🚪</span>
                <span>退出</span>
            </button>
        </div>
    </div>

    <script src="/assets/js/app.js"></script>
</body>
</html>
